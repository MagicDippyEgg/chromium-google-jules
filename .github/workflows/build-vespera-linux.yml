name: Build Vespera Linux

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-vespera:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Vespera Source
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld ninja-build python3 python3-pkg-resources \
            bison gperf pkg-config libglib2.0-dev libnss3-dev libatk1.0-dev \
            libatk-bridge2.0-dev libcups2-dev libdrm-dev libxkbcommon-dev \
            libxcomposite-dev libxdamage-dev libxrandr-dev libgbm-dev \
            libasound2-dev libpango1.0-dev libpulse-dev

      - name: Generate Build Configuration (GN)
        run: |
          gn gen out/Release --args="is_debug=false is_component_build=false symbol_level=0 blink_symbol_level=0 enable_nacl=false use_custom_libcxx=false"

      - name: Compile Vespera Browser (Ninja)
        run: |
          ninja -C out/Release chrome

      - name: Package Vespera Browser
        run: |
          mkdir -p package/vespera
          cp -r out/Release/chrome out/Release/*.pak out/Release/*.bin out/Release/locales out/Release/resources package/vespera/ || true
          tar -czvf vespera-linux-x64.tar.gz -C package vespera

      - name: Upload Vespera Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vespera-linux-x64
          path: vespera-linux-x64.tar.gz
          retention-days: 14
