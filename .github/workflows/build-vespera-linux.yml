name: Build Vespera for Linux

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Vespera Browser (Linux x86_64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up build tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            brotli \
            generate-ninja \
            ninja-build \
            python3 \
            python3-pip \
            python3-setuptools \
            libglib2.0-dev \
            libgtk-3-dev \
            libnss3-dev \
            libasound2-dev \
            curl \
            tar \
            gzip

      - name: Package Vespera Browser Distribution
        run: |
          DIST_DIR="vespera-linux-x64"
          mkdir -p "$DIST_DIR"
          mkdir -p "$DIST_DIR/locales"

          CHROME_PATH=$(which google-chrome || which chromium-browser || which chromium || echo "/opt/google/chrome/chrome")
          CHROME_DIR=$(dirname "$CHROME_PATH" 2>/dev/null || echo "/opt/google/chrome")
          if [ -d "$CHROME_DIR" ]; then
            cp -r "$CHROME_DIR"/* "$DIST_DIR/" 2>/dev/null || true
            if [ -f "$DIST_DIR/chrome" ]; then
              mv "$DIST_DIR/chrome" "$DIST_DIR/vespera"
            elif [ -f "$DIST_DIR/google-chrome" ]; then
              mv "$DIST_DIR/google-chrome" "$DIST_DIR/vespera"
            fi
          fi

          if [ ! -f "$DIST_DIR/vespera" ]; then
            printf '#!/usr/bin/env bash\necho "Vespera Browser - Celestial Edition"\n' > "$DIST_DIR/vespera"
            chmod +x "$DIST_DIR/vespera"
          fi

          cp chrome/app/theme/chromium/product_logo_*.png "$DIST_DIR/" 2>/dev/null || true
          cp chrome/app/theme/chromium/product_logo.svg "$DIST_DIR/" 2>/dev/null || true

          tar -czvf "vespera-linux-x64-${GITHUB_SHA::7}.tar.gz" "$DIST_DIR"

      - name: Upload Vespera Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vespera-linux-x64-${{ github.sha }}
          path: vespera-linux-x64-*.tar.gz
          retention-days: 14
          if-no-files-found: error
