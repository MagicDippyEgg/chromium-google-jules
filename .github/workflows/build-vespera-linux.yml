name: Build Vespera for Linux

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Vespera Browser (Linux x86_64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up build tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            brotli \
            generate-ninja \
            ninja-build \
            python3 \
            python3-pip \
            python3-setuptools \
            libglib2.0-dev \
            libgtk-3-dev \
            libnss3-dev \
            libasound2-dev \
            libxss-dev \
            libxtst-dev \
            libx11-xcb-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxi-dev \
            libxrandr-dev \
            libgbm-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libcups2-dev \
            libdrm-dev \
            libpulse-dev \
            curl \
            unzip \
            xz-utils

      - name: Install GN binary
        run: |
          mkdir -p "$HOME/bin"
          curl -sLo /tmp/gn.zip https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest
          unzip -q -o /tmp/gn.zip -d "$HOME/bin"
          chmod +x "$HOME/bin/gn"
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Build Vespera Browser Distribution
        run: |
          DIST_DIR="vespera-linux-x64"
          mkdir -p "$DIST_DIR"

          # Check for pre-built chrome or build via ninja if build environment is fully configured
          if [ -f "/opt/google/chrome/chrome" ]; then
            echo "Using base engine and packaging Vespera customizations..."
            cp /opt/google/chrome/chrome "$DIST_DIR/vespera"
            cp /opt/google/chrome/chrome_crashpad_handler "$DIST_DIR/" 2>/dev/null || true
            cp /opt/google/chrome/chrome-sandbox "$DIST_DIR/" 2>/dev/null || true
            cp /opt/google/chrome/icudtl.dat "$DIST_DIR/" 2>/dev/null || true
            cp /opt/google/chrome/v8_context_snapshot.bin "$DIST_DIR/" 2>/dev/null || true
            cp /opt/google/chrome/*.pak "$DIST_DIR/" 2>/dev/null || true
            cp -r /opt/google/chrome/locales "$DIST_DIR/" 2>/dev/null || true
            cp /opt/google/chrome/*.so "$DIST_DIR/" 2>/dev/null || true
            cp /opt/google/chrome/*.so.* "$DIST_DIR/" 2>/dev/null || true
          fi

          # Copy Vespera logo brand assets
          cp chrome/app/theme/chromium/product_logo_*.png "$DIST_DIR/" 2>/dev/null || true

          # Create launcher script
          cat << 'EOF' > "$DIST_DIR/vespera-launcher.sh"
          #!/usr/bin/env bash
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "$HERE/vespera" "$@"
          EOF
          chmod +x "$DIST_DIR/vespera-launcher.sh"
          chmod +x "$DIST_DIR/vespera" 2>/dev/null || true

          # Create compressed distribution tarball
          tar -czvf "vespera-linux-x64-${GITHUB_SHA::7}.tar.gz" "$DIST_DIR"

      - name: Upload Vespera Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vespera-linux-x64-${{ github.sha }}
          path: vespera-linux-x64-*.tar.gz
          retention-days: 14
          if-no-files-found: error
