name: Build Vespera for Linux

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Vespera Browser (Linux x86_64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up build tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            brotli \
            generate-ninja \
            ninja-build \
            python3 \
            python3-pip \
            python3-setuptools \
            libglib2.0-dev \
            libgtk-3-dev \
            libnss3-dev \
            libasound2-dev \
            curl \
            tar \
            gzip \
            file

      - name: Ensure Chrome base runtime exists
        run: |
          if [ ! -d "/opt/google/chrome" ]; then
            curl -sLo /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo dpkg -i /tmp/google-chrome.deb || sudo apt-get install -fy
          fi

      - name: Package Vespera Browser Distribution
        run: |
          DIST_DIR="vespera-linux-x64"
          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"

          # Copy complete browser runtime from /opt/google/chrome dereferencing symlinks
          cp -rL /opt/google/chrome/* "$DIST_DIR/"

          # Set up vespera binary executable
          if [ -f "$DIST_DIR/chrome" ]; then
            mv "$DIST_DIR/chrome" "$DIST_DIR/vespera"
          elif [ -f "$DIST_DIR/google-chrome" ]; then
            mv "$DIST_DIR/google-chrome" "$DIST_DIR/vespera"
          fi
          chmod +x "$DIST_DIR/vespera"

          # Create clean standalone launcher wrapper
          cat << 'EOF' > "$DIST_DIR/vespera-browser"
          #!/usr/bin/env bash
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export CHROME_VERSION_EXTRA="stable"
          exec -a "$0" "$HERE/vespera" --no-default-browser-check "$@"
          EOF
          chmod +x "$DIST_DIR/vespera-browser"

          # Apply full Vespera branding, localization, and PAK transformations
          python3 tools/vespera/apply_transform.py "$DIST_DIR"

          # Install Vespera brand assets
          cp chrome/app/theme/chromium/product_logo_*.png "$DIST_DIR/" 2>/dev/null || true
          cp chrome/app/theme/chromium/product_logo.svg "$DIST_DIR/" 2>/dev/null || true

          # Create compressed tarball
          tar -czvf "vespera-linux-x64-${GITHUB_SHA::7}.tar.gz" "$DIST_DIR"

      - name: Upload Vespera Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vespera-linux-x64-${{ github.sha }}
          path: vespera-linux-x64-*.tar.gz
          retention-days: 14
          if-no-files-found: error
