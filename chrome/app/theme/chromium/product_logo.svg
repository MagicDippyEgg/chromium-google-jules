<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="vesperaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2BE2" />
      <stop offset="50%" stop-color="#4A00E0" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#00F2FE" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4FACFE" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Dark Rounded Hexagon Base -->
  <rect width="256" height="256" rx="64" fill="#0D1117" />
  <!-- Outer Cosmic Ring -->
  <circle cx="128" cy="128" r="96" fill="none" stroke="url(#vesperaGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="480 80" />
  <!-- Inner Glow Orb -->
  <circle cx="128" cy="128" r="60" fill="url(#innerGlow)" />
  <!-- Central Diamond / Star of Vespera -->
  <path d="M 128 56 Q 128 128 200 128 Q 128 128 128 200 Q 128 128 56 128 Q 128 128 128 56 Z" fill="url(#vesperaGrad)" filter="url(#glow)" />
  <!-- Core Star Sparkle -->
  <circle cx="128" cy="128" r="16" fill="#FFFFFF" />
  <circle cx="168" cy="88" r="6" fill="#00F2FE" />
  <circle cx="88" cy="168" r="4" fill="#8A2BE2" />
</svg>